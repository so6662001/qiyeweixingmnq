server:
  port: 8000
  address: 127.0.0.1

spring:
  application:
    name: wecom-simulator
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

wecom:
  # —— 统一收件箱（真实收发；凭据只从环境变量注入） ——
  # 入站：个人微信来自 OpenClaw 插件回推，企业微信来自会话内容存档
  # 出站：两个通道都通过 OpenClaw 发送
  bridge:
    enabled: ${WECOM_BRIDGE_ENABLED:false}
    data-dir: data/bridge
    max-messages: 5000
    # 无真实配置时保留本地演示会话，便于先验证「实时收 → 页面内回」链路
    demo-inbox: ${WECOM_BRIDGE_DEMO_INBOX:true}
    # 演练模式：出站（发消息/发朋友圈/群发）只记录不真发。真实环境首测建议先开
    dry-run: ${WECOM_BRIDGE_DRY_RUN:false}

    # 访问鉴权：收件箱能看全部客户会话并以你的身份发消息，
    # 要从手机/外网访问必须设置口令；留空则只允许本机回环访问
    auth:
      enabled: ${WECOM_AUTH_ENABLED:true}
      access-code: ${WECOM_ACCESS_CODE:}
      session-ttl: ${WECOM_AUTH_SESSION_TTL:7d}
      # 走 HTTPS 时置 true
      cookie-secure: ${WECOM_AUTH_COOKIE_SECURE:false}

    # OpenClaw：个人微信收发 + 企业微信出站
    openclaw:
      enabled: ${WECOM_OPENCLAW_ENABLED:false}
      cli-path: ${WECOM_OPENCLAW_CLI:openclaw}
      wechat-channel: ${WECOM_OPENCLAW_WECHAT_CHANNEL:openclaw-weixin}
      account: ${WECOM_OPENCLAW_ACCOUNT:}
      command-timeout: 20s
      # 与 OpenClaw 插件配置里的 token 保持一致；为空则拒绝所有入站请求
      inbound-token: ${WECOM_OPENCLAW_INBOUND_TOKEN:}
      # 定期探测网关与微信渠道是否还活着；人不在电脑旁时靠它判断能不能用
      health-check-enabled: ${WECOM_OPENCLAW_HEALTH_CHECK:true}
      health-check-interval: ${WECOM_OPENCLAW_HEALTH_INTERVAL:60s}

    # 企业微信会话内容存档：入站唯一来源
    archive:
      enabled: ${WECOM_ARCHIVE_ENABLED:false}
      corp-id: ${WECOM_CORP_ID:}
      secret: ${WECOM_ARCHIVE_SECRET:}
      # 公钥版本号 → PKCS#8 私钥 PEM，例如 WECOM_ARCHIVE_PRIVATE_KEYS_1
      private-keys:
        "1": ${WECOM_ARCHIVE_PRIVATE_KEY_V1:}
      sdk-library-path: ${WECOM_ARCHIVE_SDK_LIB:}
      poll-interval: 5s
      batch-limit: 1000
      proxy: ${WECOM_ARCHIVE_PROXY:}
      proxy-passwd: ${WECOM_ARCHIVE_PROXY_PASSWD:}
      request-timeout-seconds: 10
      external-only: ${WECOM_ARCHIVE_EXTERNAL_ONLY:false}
      include-room-chats: ${WECOM_ARCHIVE_INCLUDE_ROOMS:false}
      # 本企业成员 UserID，用于判断消息方向；留空按 external_userid 形态推断
      member-userids: ${WECOM_ARCHIVE_MEMBER_USERIDS:}
      # 存档身份 → OpenClaw 发送目标（也可在页面上逐个补填）
      target-mapping: {}

    # 企业微信客户联系：朋友圈发表与互动数据、客户群群发
    contact:
      enabled: ${WECOM_CONTACT_ENABLED:false}
      # 留空时复用 archive.corp-id
      corp-id: ${WECOM_CONTACT_CORP_ID:}
      secret: ${WECOM_CONTACT_SECRET:}
      api-base: ${WECOM_CONTACT_API_BASE:https://qyapi.weixin.qq.com}
      request-timeout: 15s
      # 朋友圈互动数据（点赞/评论）自动刷新
      moment-stats-auto-refresh: ${WECOM_MOMENT_STATS_AUTO:true}
      moment-stats-interval: ${WECOM_MOMENT_STATS_INTERVAL:10m}
      # 回看天数，官方限制查询区间不超过 30 天
      moment-lookback-days: ${WECOM_MOMENT_LOOKBACK_DAYS:7}

  simulator:
    # 企微通道目录（个人微信使用 data/wechat/*，见 ProductChannel）
    voice-dir: data/voices
    file-dir: data/files
    moment-image-dir: data/moments
    demo-bot-enabled: true
    max-voice-files: 200
    max-moment-images: 200
    webhook:
      # 本地联调默认仅允许回环；若需回调到 Docker/局域网服务再开启
      allow-private-network: false
      allowed-hosts: localhost,127.0.0.1,::1

logging:
  level:
    com.wecom.simulator: INFO
    com.wecom.bridge: INFO
