<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>企微模拟器 · 高保真效果图索引</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #f4f8ff;
        --soft: rgba(220, 232, 248, 0.78);
        --font: "Noto Sans SC", "Sora", sans-serif;
        --display: "Sora", "Noto Sans SC", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; font-family: var(--font); color: var(--ink);
        background:
          radial-gradient(1000px 500px at 10% -10%, rgba(31,111,235,.4), transparent 55%),
          radial-gradient(800px 420px at 90% 0%, rgba(15,138,107,.28), transparent 50%),
          linear-gradient(155deg, #0b1628, #12233b 45%, #183153);
        padding: 48px 22px;
      }
      .wrap { max-width: 980px; margin: 0 auto; }
      h1 {
        margin: 0; font-family: var(--display); font-size: clamp(2.2rem, 4vw, 3rem);
        letter-spacing: -.03em;
      }
      p { color: var(--soft); line-height: 1.6; }
      .grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px; margin-top: 28px;
      }
      a.card {
        display: block; text-decoration: none; color: inherit;
        padding: 22px; border-radius: 20px;
        background: rgba(248,251,255,.08); border: 1px solid rgba(255,255,255,.14);
        box-shadow: 0 18px 40px rgba(0,0,0,.18);
        transition: transform .18s ease, background .18s ease;
      }
      a.card:hover { transform: translateY(-3px); background: rgba(248,251,255,.12); }
      a.card h2 { margin: 0 0 8px; font-size: 1.25rem; }
      a.card p { margin: 0; font-size: .92rem; }
      .kicker {
        display: inline-block; margin-bottom: 10px; font-size: .75rem; letter-spacing: .08em;
        text-transform: uppercase; color: #8ec5ff; font-family: var(--display); font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>企微模拟器</h1>
      <p>高保真 HTML 效果图索引：会话、群聊、朋友圈三套界面，可直接在浏览器打开预览。</p>
      <div class="grid">
        <a class="card" href="./wecom-simulator-hifi.html">
          <span class="kicker">Chat</span>
          <h2>会话效果图</h2>
          <p>文字 / 语音收发、演示 Bot、Webhook、主动文字回复。</p>
        </a>
        <a class="card" href="./wecom-group-hifi.html">
          <span class="kicker">Group</span>
          <h2>群聊效果图</h2>
          <p>群内文字 / 语音 / 图片 / 文件，以及回复指定人、@提及。</p>
        </a>
        <a class="card" href="./wecom-moments-hifi.html">
          <span class="kicker">Moments</span>
          <h2>朋友圈效果图</h2>
          <p>图片+方案发帖、点赞/评论动态，以及 CRM 线索同步。</p>
        </a>
      </div>
    </div>
  </body>
</html>
